name: Claude Code via AnyRouter

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  id-token: write       
  contents: read       
  issues: write      
  pull-requests: write  

jobs:
  claude:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
        env:
          model: nvidia/nemotron-3-super-120b-a12b:free
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          
